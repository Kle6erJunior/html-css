<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'StarJedi';
            src: url('fonts/starjedi/Starjedi.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;

            /* 
            Tipos de Format()
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced Typography)
            - svg
            */
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

        }

        h1{
            font-family: 'StarJedi', sans-serif;
            font-size: 3em;
            font-weight: lighter;
        }

    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Numquam ex nemo, vel minus accusantium quo. Dolorum dolorem vitae odit aliquid quibusdam rem tempore obcaecati eius mollitia harum! Ipsum, praesentium odit!</p>
</body>
</html>
