<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela colgroup</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }


        table{
            border-collapse: collapse;
            width: 600px;
        }

        th, td{
            border: 1px solid black;
            padding: 10px;
        }

        .cnome{
            background-color: red;
        }

        .csexo{
            background: yellow;
        }

        .cgrupo{
            background-color: blue;
        }
    </style>
</head>
<body>
    <h1>Tabela Colgroup</h1>

    <table>
        <colgroup>
        <col class="cnome">
        <col class="csexo">
        <col class="cgrupo" span="2">
        </colgroup>
        <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Sexo</th>
                <th scope="col">Idade</th>
                <th scope="col">Profissão</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Ana Clara</td>
                <td>F</td>
                <td>21</td>
                <td>Dev</td>
            </tr>
            <tr>
                <td>Geovana Oliveira</td>
                <td>F</td>
                <td>25</td>
                <td>Advogada</td>
            </tr>
            <tr>
                <td>Maria Eduarda</td>
                <td>F</td>
                <td>30</td>
                <td>Professora</td>
            </tr>

            <tr>
                <td>Luis Carlos</td>
                <td>M</td>
                <td>35</td>
                <td>Taxista</td>
            </tr>
            <tr>
                <td>Carlos Eduardo</td>
                <td>M</td>
                <td>22</td>
                <td>Empreendedor</td>
            </tr>
            <tr>
                <td>Gabriel Santos</td>
                <td>M</td>
                <td>23</td>
                <td>Ator</td>
            </tr>
            
        </tbody>
    </table>
</body>
</html>
